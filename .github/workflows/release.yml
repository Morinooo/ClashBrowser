name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # The first build downloads the mihomo core and Geo databases.
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt

      - name: Prepare release assets
        run: |
          APK_NAME="ClashBrowser-${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > SHA256SUMS
          ls -l "$APK_NAME" SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            # Renamed historical tags: notes live on main, code snapshot stays at the tag
            git fetch --depth=1 origin main
            if git show "origin/main:docs/releases/${GITHUB_REF_NAME}.md" > "$RUNNER_TEMP/notes.md" 2>/dev/null; then
              NOTES="$RUNNER_TEMP/notes.md"
            else
              echo "::error::Release notes file $NOTES not found"
              exit 1
            fi
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "ClashBrowser-${GITHUB_REF_NAME}-arm64-v8a.apk" \
            SHA256SUMS \
            --title "ClashBrowser ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES" \
            --verify-tag
