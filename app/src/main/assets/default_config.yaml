mixed-port: 17890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:19090
secret: ""
ipv6: false
unified-delay: true
geodata-mode: false
geo-auto-update: false
find-process-mode: off

dns:
  enable: true
  listen: 127.0.0.1:11053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query

proxies: []
proxy-groups: []
rules:
  - MATCH,DIRECT